<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <style>
      .bold-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 110px;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      .light-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 300;
        font-size: 110px;
        fill: #00A3E0;
        letter-spacing: 1px;
      }
      .bracket {
        stroke: #00A3E0;
        stroke-width: 4;
        fill: none;
        stroke-linecap: square;
      }
      .dot {
        fill: #00A3E0;
      }
    </style>
  </defs>

  <!-- Background (Transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <g transform="translate(40, 20)">
    <!-- Citation Symbol Above 'I' -->
    <!-- Left Bracket -->
    <path class="bracket" d="M 100 52 L 85 52 L 85 92 L 100 92" />

    <!-- Center Dot -->
    <circle class="dot" cx="125" cy="72" r="6" />

    <!-- Right Bracket -->
    <path class="bracket" d="M 150 52 L 165 52 L 165 92 L 150 92" />

    <!-- Main Wordmark -->
    <text x="30" y="200">
      <tspan class="bold-text">CITA</tspan><tspan class="light-text">Lytic</tspan>
    </text>
  </g>
</svg>
